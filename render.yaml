services:
  - type: web
    name: openai-pay-long-link
    runtime: docker
    repo: https://github.com/Lyhh0729/openai-pay-long-link
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8787
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"
